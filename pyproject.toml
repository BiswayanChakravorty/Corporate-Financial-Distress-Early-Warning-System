[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-ews"
version = "0.1.0"
description = "Corporate Financial Distress Early-Warning System"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
